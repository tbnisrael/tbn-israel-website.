<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TBN Israel Admin</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><header><a class="brand" href="index.html">✦ TBN <b>ISRAEL</b><small>ADMINISTRATION</small></a><a href="index.html">View website ↗</a></header><main class="admin"><span class="label">PRIVATE WORKSPACE</span><h1>Message <i>inbox.</i></h1><p>Sign in with an authorised administrator account.</p><section id="login" class="panel"><form id="loginForm"><label>Email<input id="adminEmail" type="email" required></label><label>Password<input id="adminPassword" type="password" required></label><button class="btn">Sign in →</button><p id="loginStatus">Supabase setup is required before sign-in.</p></form></section><section id="inbox" class="panel hidden"><div class="inboxHead"><h2>Conversations</h2><button id="signout" class="copy">Sign out</button></div><div class="inbox"><div id="list"></div><div id="detail">Choose a conversation to read and reply.</div></div></section></main><footer><a href="index.html">Public website</a></footer><script>
let cfg=window.TBN_CONFIG||{},client=null,active=null,login=document.getElementById('login'),inbox=document.getElementById('inbox'),ls=document.getElementById('loginStatus');if(window.supabase&&cfg.url&&cfg.anonKey&&!cfg.url.includes('YOUR_')){client=window.supabase.createClient(cfg.url,cfg.anonKey);client.auth.getSession().then(({data})=>{if(data.session)showInbox()})}else{ls.textContent='Connect Supabase using README.md first.';document.querySelector('#loginForm button').disabled=true}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();let {error}=await client.auth.signInWithPassword({email:adminEmail.value,password:adminPassword.value});if(error){ls.textContent='Sign-in failed. Check credentials and administrator access.';return}showInbox()});
async function showInbox(){login.classList.add('hidden');inbox.classList.remove('hidden');await loadList()}
document.getElementById('signout').onclick=async()=>{await client.auth.signOut();inbox.classList.add('hidden');login.classList.remove('hidden')};
async function loadList(){let el=document.getElementById('list');el.textContent='Loading…';let {data,error}=await client.from('conversations').select('id,visitor_name,visitor_email,created_at').order('created_at',{ascending:false});el.innerHTML='';if(error){el.textContent='Unable to load. Confirm your user is authorised as an admin.';return}if(!data.length){el.textContent='No messages yet.';return}data.forEach(x=>{let b=document.createElement('button');b.className='conv';b.innerHTML='';let n=document.createElement('b'),em=document.createElement('small');n.textContent=x.visitor_name;em.textContent=x.visitor_email;b.append(n,em);b.onclick=()=>openThread(x);el.append(b)})}
async function openThread(c){active=c.id;let d=document.getElementById('detail');d.innerHTML='';let h=document.createElement('h2');h.textContent=c.visitor_name;let em=document.createElement('p');em.textContent=c.visitor_email;let thread=document.createElement('div');thread.className='thread';d.append(h,em,thread);let {data,error}=await client.from('messages').select('sender_role,body,created_at').eq('conversation_id',c.id).order('created_at');thread.innerHTML='';if(error){thread.textContent='Unable to load messages.';return}data.forEach(m=>{let x=document.createElement('article');x.className='bubble';let p=document.createElement('p');p.textContent=m.body;let sm=document.createElement('small');sm.textContent=m.sender_role+' · '+new Date(m.created_at).toLocaleString();x.append(p,sm);thread.append(x)});let f=document.createElement('form');f.innerHTML='<label>Reply<textarea id="reply" rows="3" required maxlength="4000"></textarea></label><button class="btn">Send reply →</button><p id="replyStatus"></p>';f.onsubmit=async e=>{e.preventDefault();let text=document.getElementById('reply').value.trim(),{error}=await client.from('messages').insert({conversation_id:c.id,sender_role:'admin',body:text});document.getElementById('replyStatus').textContent=error?'Reply failed. Check admin access.':'Reply sent.';if(!error)openThread(c)};d.append(f)}
</script></body></html>
